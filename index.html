<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eclipsia Images</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>Eclipsia Image Hosting</h1>
    <p>Click an image to copy its URL</p>
    <div class="search-wrapper">
      <input type="text" id="search" placeholder="Search images..." autocomplete="off" />
    </div>
  </header>

  <main>

    <section id="images">
      <h2>Images</h2>
      <div class="grid" id="images-grid">
        <!-- Add images directly to images/ -->
        <p class="empty loading">Loading...</p>
      </div>
    </section>

  </main>

  <div id="toast">URL copied!</div>

  <script>
    // Auto-detect from GitHub Pages URL (username.github.io/repo)
    const GITHUB_USER = window.location.hostname.split('.')[0];
    const GITHUB_REPO = window.location.pathname.split('/').filter(Boolean)[0] || 'eclipsia-images';
    const BRANCH      = 'main';

    const IMAGE_EXT = /\.(png|jpg|jpeg|gif|webp|svg)$/i;
    const RAW_BASE  = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/${BRANCH}/`;
    const API_BASE  = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/`;

    const FOLDER = 'images';
    const LOCAL_IMAGES = [
      'ab545e91-f90f-46ed-8db4-d7ae1542f774.png',
      'degamekroegbreed.png',
      'eclipsiacoin.png'
    ];

    function renderImages(files) {
      const grid = document.getElementById('images-grid');
      const images = files.filter(file => IMAGE_EXT.test(file.name));

      grid.innerHTML = '';

      if (images.length === 0) {
        grid.innerHTML = '<p class="empty">No images yet.</p>';
        return;
      }

      images.forEach(file => {
        const imgUrl = file.download_url || `${FOLDER}/${file.name}`;
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<img src="${imgUrl}" alt="${file.name}" /><span>${file.name.replace(/\.[^.]+$/, '')}</span>`;
        card.addEventListener('click', () => {
          navigator.clipboard.writeText(imgUrl).then(() => {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
          });
        });
        grid.appendChild(card);
      });
    }

    async function loadImages() {
      const grid = document.getElementById('images-grid');
      try {
        if (!GITHUB_USER || window.location.protocol === 'file:') {
          renderImages(LOCAL_IMAGES.map(name => ({ name })));
          return;
        }

        const res  = await fetch(API_BASE + FOLDER);
        if (!res.ok) throw new Error(`GitHub API returned ${res.status}`);
        const files = await res.json();
        renderImages(files.filter(file => file.type === 'file'));
      } catch (e) {
        renderImages(LOCAL_IMAGES.map(name => ({ name })));
      }
    }

    loadImages();

    document.getElementById('search').addEventListener('input', function () {
      const query = this.value.trim().toLowerCase();
      document.querySelectorAll('.card').forEach(card => {
        const name = card.querySelector('span').textContent.toLowerCase();
        card.style.display = name.includes(query) ? '' : 'none';
      });
    });
  </script>

</body>
</html>
